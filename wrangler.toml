name = "streams"
main = "src/worker.js"
compatibility_date = "2024-09-25"

[assets]
directory = "./public"
binding = "ASSETS"
# Todo pasa por el Worker salvo los estáticos de DBD (iconos, retratos, objetos y JSON),
# que se sirven directamente con las cabeceras de public/_headers (CORS y caché) para la web.
run_worker_first = ["/*", "!/dbd/icons/*", "!/dbd/items/*", "!/dbd/pj/*", "!/dbd/*.json"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
